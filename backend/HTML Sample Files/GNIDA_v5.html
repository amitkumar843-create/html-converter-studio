<script>
function goToSlide(n) {
  const el = document.getElementById('slide-' + n);
  if (el) el.scrollIntoView({ behavior:'smooth', block:'center' });
}
document.addEventListener('keydown', function(e) {
  const visible = [...document.querySelectorAll('.slide-shell')].reduce((best, el) => {
    const rect = el.getBoundingClientRect();
    const score = Math.abs(rect.top + rect.height/2 - window.innerHeight/2);
    return !best || score < best.score ? {el, score} : best;
  }, null);
  const current = visible ? Number(visible.el.id.replace('slide-', '')) : 1;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') goToSlide(Math.min(5, current + 1));
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') goToSlide(Math.max(1, current - 1));
});
</script>

<script id="per-slide-fit-nav-script">
(function(){
  const BASE_W = 1280;
  const BASE_H = 720;

  function fitSlides() {
    const vw = Math.max(320, window.innerWidth);
    const vh = Math.max(240, window.innerHeight);
    const scale = Math.min(vw / BASE_W, vh / BASE_H, 1);
    const scaledW = Math.floor(BASE_W * scale);

    document.querySelectorAll('.slide-shell').forEach(shell => {
      shell.style.width = scaledW + 'px';
      shell.style.height = vh + 'px';
      shell.style.minHeight = vh + 'px';
    });
    document.querySelectorAll('.slide-frame').forEach(frame => {
      frame.style.width = BASE_W + 'px';
      frame.style.height = BASE_H + 'px';
      frame.style.transform = 'scale(' + scale + ')';
      frame.style.transformOrigin = 'top left';
    });
  }

  document.querySelectorAll('.slide-nav-panel a').forEach(link => {
    link.addEventListener('click', function(e){
      e.preventDefault();
      const target = document.querySelector(this.getAttribute('href'));
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });

  window.addEventListener('load', fitSlides);
  window.addEventListener('resize', fitSlides);
  document.addEventListener('DOMContentLoaded', fitSlides);
  fitSlides();
})();
</script>
